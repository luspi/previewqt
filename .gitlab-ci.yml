localization:

  image: ubuntu:noble

  only:
    - schedules

  script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update && apt-get install -y qt6-base-dev qt6-l10n-tools git wget
    - git config --global user.email "Lukas@previewqt.org"
    - git config --global user.name "Lukas Spies"
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/lspies/previewqt-lang.git && cd previewqt-lang
    - /usr/lib/qt6/bin/lupdate -no-obsolete ../qml/ ../cplusplus/ -ts previewqt.ts
    - git add previewqt.ts
    - git diff-index --quiet HEAD || git commit -m "updating translation source files from CI - Qt6 version"
    - git push origin main

appimage:

  image: ubuntu:noble

  only:
    - schedules

  script:
    # start of appimage recipe
    - export DEBIAN_FRONTEND=noninteractive
    - apt update &&  apt -y install git software-properties-common build-essential libgl1-mesa-dev cmake wget extra-cmake-modules apt-transport-https curl
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL http://archive.neon.kde.org/public.key | gpg --dearmor -o /etc/apt/keyrings/neon-archive-keyring.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/neon-archive-keyring.gpg] http://archive.neon.kde.org/user noble main" | tee /etc/apt/sources.list.d/neon.list
    - apt update && apt -y upgrade
    - apt -y install qt6-base-dev qt6-image-formats-plugins qt6-image-formats-plugin-pdf libqt6svg6-dev libqt6chartsqml6 qml6-module-qt-labs-platform qml6-module-qtcore qml6-module-qtmultimedia qml6-module-qtqml qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qt6-multimedia-dev qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qtquick-dialogs qt6-tools-dev qt6-l10n-tools qt6-tools-dev-tools qt6-pdf-dev qml6-module-org-kde-syntaxhighlighting
    - apt -y install libarchive-dev libraw-dev libdevil-dev gstreamer1.0-tools libexiv2-dev libvips-dev gstreamer1.0-libav libopenh264-7 libreofficekit-dev libreoffice-base-core libopenslide-dev libappimage-dev
    # Install up-to-date ImageMagick
    - git clone https://github.com/ImageMagick/ImageMagick
    - cd ImageMagick
    - git checkout $(git describe --tags --abbrev=0)
    - ./configure --prefix=/usr --with-bzlib --with-fontconfig --with-freetype=yes --with-gslib --with-gvc --with-jpeg --with-png --with-tiff --with-xml --with-gs-font-dir --enable-hdri --disable-docs --with-webp --with-wmf --with-rsvg --with-fftw
    - make -j$(nproc) install
    - cd ..
    # skip for release:
    - rm -rf lang/
    # skip for release:
    - git clone -b l10n_main https://gitlab.com/lspies/previewqt-lang
    # skip for release:
    - mv previewqt-lang/localized lang
    - mkdir -p build && cd build/
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DWITH_EXIV2=ON -DWITH_GRAPHICSMAGICK=OFF -DWITH_IMAGEMAGICK=ON -DWITH_QTMULTIMEDIA=ON -DWITH_LIBMPV=OFF -DWITH_LIBVIPS=ON -DWITH_POPPLER=OFF -DWITH_EXIV2_ENABLE_BMFF=ON -DWITH_RESVG=OFF -DWITH_MOTIONPHOTO=ON -DWITH_LCMS2=ON -DWITH_KF6SYNTAXHIGHLIGHT=ON -DWITH_LIBREOFFICE=OFF -DWITH_LIBREOFFICEKIT=ON -DWITH_LIBSAI=ON -DWITH_OPENSLIDE=ON -DWITH_LIBAPPIMAGE=ON
    - make DESTDIR=../appdir -j$(nproc) install
    - cd ..
    - wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
    - wget -c https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
    - chmod a+x *.AppImage
    - ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract
    - ./linuxdeploy-x86_64.AppImage --appimage-extract
    - rm ./linuxdeploy-plugin-qt-x86_64.AppImage
    - export EXTRA_PLATFORM_PLUGINS=libqwayland.so
    - export EXTRA_QT_MODULES="waylandcompositor;svg"
    - export DEPLOY_PLATFORM_THEMES=1
    - export UPDATE_INFORMATION="zsync|https://gitlab.com/api/v4/projects/55625295/jobs/artifacts/main/raw/PreviewQt-nightly.AppImage.zsync?job=appimage"
    - export LDAI_UPDATE_INFORMATION=$UPDATE_INFORMATION
    - export LDAI_OUTPUT=PreviewQt-nightly.AppImage
    #- export LDAI_SIGN=1   # used by automated appimage builder
    #- export LDAI_SIGN_KEY=GPG_KEY_ID    # used by automated appimage builder
    - export LD_LIBRARY_PATH=appdir/usr/lib
    - export QML_SOURCES_PATHS=./qml
    - ./squashfs-root/AppRun --appdir ./appdir/ --plugin=qt --output appimage
    # end of appimage recipe

  artifacts:
    paths:
      - PreviewQt-nightly.AppImage
      - PreviewQt-nightly.AppImage.zsync
